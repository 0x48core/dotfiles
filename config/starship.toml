add_newline = true

format = """
[\ue0b6](fg:#dea0d1)\
[ \u2721 ](bg:#dea0d1 fg:#282a36)\
[\ue0b0](fg:#dea0d1 bg:#fafeba)\
$directory\
$git_branch\
[\ue0b0](fg:#fafeba)\
$character"""

[directory]
format = "[ $path ](bg:#fafeba fg:#282a36)"
truncation_length = 2
truncate_to_repo = false
home_symbol = "~"

[git_branch]
format = "[\ue0a0 $branch ](bg:#fafeba fg:#282a36)"

[character]
success_symbol = " "
error_symbol = "[✗](red) "
